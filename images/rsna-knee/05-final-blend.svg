  <text class="t" x="164.0" y="491" text-anchor="middle">goodpjw 2.5D reader v11</text>
  <text class="s" x="164.0" y="510" text-anchor="middle">ConvNeXt, 3 public folds</text>
  <rect class="proc" x="316" y="144" width="230" height="64" rx="10"/>
  <text class="t" x="431.0" y="171" text-anchor="middle">nartaa anchor  N</text>
