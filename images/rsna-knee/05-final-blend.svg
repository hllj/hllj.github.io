  <rect class="ext" x="44" y="104" width="240" height="64" rx="10"/>
  <text class="t" x="164.0" y="131" text-anchor="middle">nartaa CoAtNet @384</text>
  <text class="s" x="164.0" y="150" text-anchor="middle">public LB 0.949 · OAI-trained</text>
  <rect class="ext" x="44" y="184" width="240" height="64" rx="10"/>
  <text class="t" x="164.0" y="211" text-anchor="middle">nartaa 224-crop model</text>
  <text class="s" x="164.0" y="230" text-anchor="middle">public LB 0.945 · OAI-trained</text>
  <rect class="ext" x="44" y="284" width="240" height="64" rx="10"/>
