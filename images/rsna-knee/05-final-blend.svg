  <text class="al" x="300" y="448" text-anchor="middle">rank</text>
  <rect class="model" x="578" y="220" width="230" height="210" rx="10"/>
  <text class="t" x="693.0" y="252" text-anchor="middle">Per-finding fusion</text>
  <text class="s" x="693.0" y="276" text-anchor="middle">for each finding c:</text>
  <text class="s" x="693.0" y="298" text-anchor="middle">w_c (1 − g_c) · N</text>
  <text class="s" x="693.0" y="320" text-anchor="middle">+ (1 − w_c)(1 − g_c) · H</text>
  <text class="s" x="693.0" y="342" text-anchor="middle">+ g_c · G</text>
  <text class="s" x="693.0" y="364" text-anchor="middle">→ re-rank per finding</text>
  <text class="s" x="693.0" y="386" text-anchor="middle">(build_kernels.py)</text>
