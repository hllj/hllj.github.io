  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <text x="24" y="44" font-size="22" font-weight="700" fill="#1f2937">Final submissions EXP-124 / EXP-127: per-finding rank fusion</text>
  <text x="24" y="68" font-size="14" fill="#6b7280">Each stage's test predictions become per-finding percentile ranks (AUC only depends on order), are mixed with per-finding weights, then re-ranked.</text>
  <text class="th" x="44" y="96">Public stages (verbatim, sha-checked)</text>
  <text class="th" x="316" y="96">Slots (ours)</text>
