<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .t { font-size: 22px; font-weight: 700; fill: #1f2937; }
    .st { font-size: 14px; fill: #6b7280; }
    .h { font-size: 14px; font-weight: 600; fill: #111827; }
    .b { font-size: 14px; fill: #111827; }
    .s { font-size: 12px; fill: #4b5563; }
    .sb { font-size: 12px; font-weight: 600; fill: #111827; }
    .sec { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
    .al { font-size: 12px; font-style: italic; fill: #475569; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .data { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
    .proc { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; }
    .model { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .lab { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .ext { fill: #fce7f3; stroke: #db2777; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .out { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .arr { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .neg { stroke: #b91c1c; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ahr); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <text x="24" y="44" class="t">Training and experiment loop</text>
  <text x="24" y="66" class="st">One hypothesis per iteration · 99 experiment ids (EXP-000 … EXP-128) · 66 Kaggle submissions, 64 scored</text>

  <text x="24" y="100" class="sec">THE ITERATION LOOP (CLAUDE.md, docs/WORKFLOW.md)</text>

  <!-- Step 1 -->
  <rect x="24" y="114" width="300" height="160" rx="10" class="model"/>
  <circle cx="44" cy="136" r="11" fill="#7c3aed"/><text x="44" y="141" text-anchor="middle" class="num">1</text>
  <text x="62" y="141" class="h">Train fold 0 on vast.ai</text>
  <text x="40" y="164" class="s">scripts/vast/train.sh &lt;config&gt; 0 [overrides]</text>
  <text x="40" y="181" class="s">one architecture, one change at a time</text>
  <text x="40" y="204" class="s">compare with the current best's fold 0</text>
  <text x="40" y="221" class="s">(same held-out studies), e.g. EXP-024</text>
  <text x="40" y="238" class="s">dense: OOF 0.8745, gold-58 0.9037</text>
  <text x="40" y="261" class="s">status.sh: per-epoch report / gold AUC</text>

  <!-- Gate -->
  <polygon points="430,124 506,194 430,264 354,194" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="190" text-anchor="middle" class="h">Gate</text>
  <text x="430" y="207" text-anchor="middle" class="s">fold 0</text>
  <line x1="324" y1="194" x2="352" y2="194" class="arr"/>
  <text x="442" y="296" class="s">pass if fold-0 OOF ≥ best − 0.003</text>
  <text x="442" y="313" class="s">and gold-58 drops ≤ ~0.02 (fold spread ±0.008 / ±0.011)</text>
  <text x="509" y="186" class="al">pass</text>

  <!-- Step 2 -->
  <rect x="540" y="114" width="300" height="160" rx="10" class="proc"/>
  <circle cx="560" cy="136" r="11" fill="#475569"/><text x="560" y="141" text-anchor="middle" class="num">2</text>
  <text x="578" y="141" class="h">Folds 1–4, then submit</text>
  <text x="556" y="164" class="s">submit.sh EXP-NNN "msg" &lt;ckpts&gt;:</text>
  <text x="556" y="181" class="s">fold 0 alone, then the 5-fold ensemble</text>
  <text x="556" y="204" class="s">checkpoints → hlly34/rsna-knee-weights</text>
  <text x="556" y="221" class="s">+ unique UPLOAD_EXP-NNN_&lt;time&gt; marker;</text>
  <text x="556" y="238" class="s">notebook must load exactly that version</text>
  <text x="556" y="255" class="s">(EXP-017 once scored stale weights)</text>
  <line x1="506" y1="194" x2="538" y2="194" class="arr"/>

  <!-- Kaggle inference -->
  <rect x="876" y="114" width="300" height="160" rx="10" class="out"/>
  <text x="892" y="138" class="h">Kaggle notebook → LB</text>
  <text x="892" y="160" class="s">rsna-knee-inference, generated by</text>
  <text x="892" y="177" class="s">build_kernels.py; GPU, internet off</text>
  <text x="892" y="200" class="s">stream mode: ~7 min to preprocess</text>
  <text x="892" y="217" class="s">~1,300 test studies; 9 h limit,</text>
  <text x="892" y="234" class="s">own runs kept under ~3 h</text>
  <text x="892" y="257" class="s">5 submissions/day, keep 1 spare</text>
  <line x1="840" y1="194" x2="874" y2="194" class="arr"/>

  <!-- Row B: 5 ← 4 ← 3 -->
  <rect x="24" y="340" width="412" height="128" rx="10" class="proc"/>
  <circle cx="44" cy="362" r="11" fill="#475569"/><text x="44" y="367" text-anchor="middle" class="num">5</text>
  <text x="62" y="367" class="h">Report + next steps</text>
  <text x="40" y="390" class="s">experiments/reports/ITER-NN_&lt;date&gt;.md from TEMPLATE.md:</text>
  <text x="40" y="407" class="s">result vs current best, CV–LB reading, keep / drop,</text>
  <text x="40" y="424" class="s">ranked next ideas, cost</text>
  <text x="40" y="447" class="s">failed gate → recorded as NEGATIVE, straight here</text>

  <rect x="464" y="340" width="332" height="128" rx="10" class="data"/>
  <circle cx="484" cy="362" r="11" fill="#0284c7"/><text x="484" y="367" text-anchor="middle" class="num">4</text>
  <text x="502" y="367" class="h">Back up models, destroy the box</text>
  <text x="480" y="390" class="s">scp models/ → runs/EXP-NNN/</text>
  <text x="480" y="407" class="s">upload_models.py → Kaggle Models</text>
  <text x="480" y="424" class="s">one Model per architecture, one</text>
  <text x="480" y="441" class="s">variation per fold</text>
  <text x="480" y="458" class="s">vastai destroy instance &lt;id&gt;</text>

  <rect x="828" y="340" width="348" height="128" rx="10" class="lab"/>
  <circle cx="848" cy="362" r="11" fill="#d97706"/><text x="848" y="367" text-anchor="middle" class="num">3</text>
  <text x="866" y="367" class="h">Results + CV vs LB</text>
  <text x="844" y="390" class="s">track.py lb: public LB matched by the</text>
  <text x="844" y="407" class="s">EXP-NNN prefix of the submission message</text>
  <text x="844" y="424" class="s">track.py add → experiments/registry.csv</text>
  <text x="844" y="441" class="s">→ EXPERIMENTS.md (ΔOOF / Δgold / ΔLB)</text>
  <text x="844" y="458" class="s">update README "Current best"</text>

  <line x1="1026" y1="274" x2="1026" y2="338" class="arr"/>
  <line x1="828" y1="404" x2="798" y2="404" class="arr"/>
  <line x1="464" y1="404" x2="438" y2="404" class="arr"/>
  <!-- 5 -> 1 loop -->
  <line x1="120" y1="340" x2="120" y2="276" class="arr"/>
  <text x="128" y="316" class="al">next hypothesis</text>
  <!-- gate fail -->
  <line x1="430" y1="264" x2="430" y2="338" class="neg"/>
  <text x="422" y="304" text-anchor="end" class="al" style="fill:#b91c1c">fail</text>

  <!-- ===== Bottom panels ===== -->
  <text x="24" y="510" class="sec">HARDWARE AND COST</text>
  <rect x="24" y="522" width="460" height="330" rx="10" class="proc"/>
  <text x="40" y="546" class="h">Training: vast.ai, rented per run</text>
  <text x="40" y="568" class="s">preferred box: 1× RTX 3090 (24 GB), ≥ 16 CPU cores</text>
  <text x="40" y="585" class="s">(data loading is the bottleneck), ≥ 64 GB RAM,</text>
  <text x="40" y="602" class="s">≥ 100 GB disk, PyTorch CUDA 12.x image</text>
  <text x="40" y="619" class="s">RTX 4090 for ITER-14; long jobs in a named tmux session;</text>
  <text x="40" y="636" class="s">every instance destroyed after its run</text>

  <text x="40" y="666" class="h">Data + inference: Kaggle, free quota</text>
  <text x="40" y="688" class="s">~30 GPU-h / week: cache builds, test runs, all 66</text>
  <text x="40" y="705" class="s">submissions (T4 inference notebooks)</text>

  <text x="40" y="735" class="h">Measured vast.ai cost</text>
  <rect x="40" y="750" width="98" height="20" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="146" y="765" class="s">ITER-13 ≈ $2.3 · 2× RTX 3090, 2.16 h</text>
  <rect x="40" y="780" width="145" height="20" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="193" y="795" class="s">ITER-14 ≈ $3.4 · 1× RTX 4090, ~4.9 h</text>
  <text x="40" y="825" class="s">earlier iterations: planned $1–6 each (in their reports)</text>
  <text x="40" y="842" class="s">bar length proportional to dollars</text>

  <text x="516" y="510" class="sec">ITER-14: S6 RECIPE RETRAIN (nartaa's argv, seed 43) → EXP-128</text>
  <rect x="516" y="522" width="660" height="330" rx="10" class="model"/>
  <text x="532" y="546" class="h">ConvNeXt-S (convnext_small.fb_in22k_ft_in1k), heliosli S6 head</text>
  <text x="532" y="566" class="s">per-finding spatial attention + window-attention MIL over the study</text>

  <g>
    <text x="532" y="596" class="sb">data</text><text x="640" y="596" class="s">px cache, 4,263 training studies (all data, gold-58 excluded)</text>
    <text x="532" y="616" class="sb">schedule</text><text x="640" y="616" class="s">16 epochs · 64 windows/study · batch 2 · 34,096 steps</text>
    <text x="532" y="636" class="sb">optimiser</text><text x="640" y="636" class="s">AdamW lr 1e-4 / head 1e-3, wd 0.05, cosine, 5 % warm-up</text>
    <text x="532" y="656" class="sb">memory</text><text x="640" y="656" class="s">bf16 + gradient checkpointing</text>
    <text x="532" y="676" class="sb">hardware</text><text x="640" y="676" class="s">1× RTX 4090: 3.6 h, 330–372 windows/s, GPU 100 %</text>
    <text x="640" y="693" class="s">(nartaa's original run: 15.0 h on an RTX 5060 laptop)</text>
  </g>

  <!-- box-time bar -->
  <text x="532" y="722" class="sb">box time ~4.9 h ≈ $3.4</text>
  <rect x="532" y="732" width="170" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <rect x="702" y="732" width="458" height="24" rx="4" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="617" y="749" text-anchor="middle" class="s">fetch + unpack + checks</text>
  <text x="931" y="749" text-anchor="middle" class="sb">training 3.6 h</text>

  <rect x="532" y="770" width="628" height="70" rx="8" class="out"/>
  <text x="548" y="792" class="s">loss at epoch 16: 0.3923 vs nartaa's 0.3911 (curve tracks theirs)</text>
  <text x="548" y="810" class="s">gold-58 macro AUC: ours 0.929 · nartaa s42 0.932 · rank mean 0.934</text>
  <text x="548" y="828" class="sb">EXP-128 (stack + s42 + s43): public 0.958 / private 0.942 = EXP-127</text>

  <!-- legend -->
  <g font-size="12">
    <rect x="590" y="868" width="14" height="12" rx="3" class="data"/><text x="610" y="878" class="s">storage</text>
    <rect x="670" y="868" width="14" height="12" rx="3" class="proc"/><text x="690" y="878" class="s">process</text>
    <rect x="752" y="868" width="14" height="12" rx="3" class="model"/><text x="772" y="878" class="s">training</text>
    <rect x="838" y="868" width="14" height="12" rx="3" class="lab"/><text x="858" y="878" class="s">gate / registry</text>
    <rect x="966" y="868" width="14" height="12" rx="3" class="out"/><text x="986" y="878" class="s">score / result</text>
    <line x1="1086" y1="874" x2="1116" y2="874" class="neg"/><text x="1122" y="878" class="s">fail</text>
  </g>
</svg>
